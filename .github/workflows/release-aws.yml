name: Container Image Releaser (AWS ECR)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional extra tag (e.g. v0.3.0). Short SHA is always pushed.'
        required: false
        default: ''

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 186617197117.dkr.ecr.us-west-2.amazonaws.com
  ECR_REPOSITORY: ghcp-service
  ECR_PUSH_ROLE_ARN: arn:aws:iam::186617197117:role/ecr-push-ghcp-service

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
      with:
        role-to-assume: ${{ env.ECR_PUSH_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78 # v2.1.2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    - name: Compute image tags
      id: tags
      env:
        RELEASE_VERSION: ${{ inputs.release_version }}
      run: |
        SHORT_SHA=$(git rev-parse --short=12 HEAD)
        TAGS="${ECR_REGISTRY}/${ECR_REPOSITORY}:${SHORT_SHA}"
        if [ -n "${RELEASE_VERSION}" ]; then
          TAGS="${TAGS},${ECR_REGISTRY}/${ECR_REPOSITORY}:${RELEASE_VERSION}"
        fi
        echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
        echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

    - name: Build and push
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
      with:
        context: .
        push: true
        tags: ${{ steps.tags.outputs.tags }}
        provenance: mode=min
        sbom: true

    - name: Summary
      env:
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        echo "Pushed: ${TAGS}" >> "$GITHUB_STEP_SUMMARY"
